name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  proto-generate:
    name: Generate Protobuf
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 'latest'

      - name: Generate protobuf code
        run: buf generate

      - name: Fix Python proto imports
        run: |
          if [ -f compute-client/src/proto/compute/v1/service_pb2_grpc.py ]; then
            sed -i 's/from compute\.v1 import/from proto.compute.v1 import/g' compute-client/src/proto/compute/v1/service_pb2_grpc.py
          fi

      - name: Upload generated proto files
        uses: actions/upload-artifact@v4
        with:
          name: generated-proto
          path: |
            backend/pkg/proto/
            compute-client/src/proto/
          retention-days: 1

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: proto-generate

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Download generated proto files
        uses: actions/download-artifact@v4
        with:
          name: generated-proto
          path: .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.out
          flags: backend
          name: backend-coverage
        continue-on-error: true

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 25" | bc -l) )); then
            echo "Coverage is below 25%!"
            exit 1
          fi

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: proto-generate

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Download generated proto files
        uses: actions/download-artifact@v4
        with:
          name: generated-proto
          path: .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

  compute-client-test:
    name: Compute Client Tests
    runs-on: ubuntu-latest
    needs: proto-generate

    defaults:
      run:
        working-directory: compute-client

    steps:
      - uses: actions/checkout@v4

      - name: Download generated proto files
        uses: actions/download-artifact@v4
        with:
          name: generated-proto
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            compute-client/requirements.txt
            compute-client/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: compute-client/coverage.xml
          flags: compute-client
          name: compute-client-coverage
        continue-on-error: true

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck
        continue-on-error: true

      - name: Build
        run: npm run build

  proto-lint:
    name: Proto Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 'latest'

      - name: Lint protos
        run: buf lint

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [backend-test, backend-build, compute-client-test, frontend-build]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.backend-test.result }}" != "success" ]] || \
             [[ "${{ needs.backend-build.result }}" != "success" ]] || \
             [[ "${{ needs.compute-client-test.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-build.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"
