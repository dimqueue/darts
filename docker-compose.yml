
services:
  backend:
    restart: on-failure
    build: .
    depends_on:
      - db
    env_file:
      - ./.env
    ports:
      - "8080:8080"
    command: run-server # migrates-up migrates-down run-server
    volumes:
      - ./configs/config.yml:/configs/config.yml:ro

  db:
    restart: on-failure
    image: postgres
    container_name: dartsdb
    env_file:
      - .env
    ports:
      - "5432:5432"