services:
  frontend:
    restart: on-failure
    image: darts-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
      - VITE_USE_MOCK_API=false
    ports:
      - "3000:80"

  backend:
    restart: on-failure
    image: darts-backend:${BUILD_MODE:-dev} # prod dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${BUILD_MODE:-dev}  # prod dev
    depends_on:
      - db
      - compute-client
    env_file:
      - ./.env
    ports:
      - "8080:8080"
    command: run-server # migrates-up migrates-down run-server
    volumes:
      - ./backend/configs/config.yml:/configs/config.yml:ro

  compute-client:
    restart: on-failure
    image: darts-compute-client:latest
    build:
      context: ./compute-client
      dockerfile: Dockerfile
    env_file:
      - ./compute-client/.env
    ports:
      - "50051:50051"
      - "5000:5000"
    volumes:
      - ${GENSIM_DATA_DIR:-~/.gensim-data}:/root/gensim-data:ro

  db:
    restart: on-failure
    image: postgres:16-alpine
    container_name: dartsdb
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: