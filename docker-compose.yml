services:
  backend:
    restart: on-failure
    image: darts-backend:${BUILD_MODE:-dev}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${BUILD_MODE:-dev}
    depends_on:
      - db
      - compute-client
    env_file:
      - ./.env
    environment:
      - POSTGRES_HOST=dartsdb
      - WORD_SERVICE_URL=compute-client:50051
    ports:
      - "8080:8080"
    volumes:
      - ./backend/configs/config.yml:/configs/config.yml:ro

  compute-client:
    restart: on-failure
    image: darts-compute-client:latest
    build:
      context: ./compute-client
      dockerfile: Dockerfile
    depends_on:
      - redis
    env_file:
      - ./.env
      - ./compute-client/.env
    environment:
      - REDIS_HOST=redis
    ports:
      - "50051:50051"
      - "5000:5000"
    volumes:
      - ${GENSIM_DATA_DIR:-~/.gensim-data}:/root/gensim-data

  redis:
    restart: on-failure
    image: redis:7-alpine
    container_name: darts-redis
    env_file:
      - ./.env
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

  frontend:
    restart: on-failure
    image: darts-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
      - VITE_USE_MOCK_API=false
    ports:
      - "3000:80"

  db:
    restart: on-failure
    image: postgres:16-alpine
    container_name: dartsdb
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  redis_data: