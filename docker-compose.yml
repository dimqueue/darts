services:
  backend:
    restart: on-failure
    image: darts-backend:${BUILD_MODE:-dev}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${BUILD_MODE:-dev}  # prod dev
    depends_on:
      - db
    env_file:
      - ./.env
    ports:
      - "8080:8080"
    command: run-server # migrates-up migrates-down run-server
    volumes:
      - ./backend/configs/config.yml:/configs/config.yml:ro

  compute-client:
    restart: on-failure
    image: darts-compute-client:latest
    build:
      context: ./compute-client
      dockerfile: Dockerfile
    env_file:
      - ./.env
    ports:
      - "5000:5000"

#  frontend:
#    restart: on-failure
#    image: darts-frontend:latest
#    build:
#      context: ./frontend
#      dockerfile: Dockerfile
#    depends_on:
#      - backend
#    ports:
#      - "3000:3000"
#    environment:
#      - REACT_APP_API_URL=http://backend:8080

  db:
    restart: on-failure
    image: postgres:16-alpine
    container_name: dartsdb
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: