port: "8080"

db:
  host: "localhost" # dartsdb localhost
  username: "admin"
  port: "5432"
  dbname: "dartsdb"
  sslmode: "disable"

word-service:
  type: "grpc" #grpc http
  baseURL: "localhost:50051" # localhost:50051 http://localhost:5000
  timeout: 30

logger:
  level: "debug"        # debug, info, warn, error, fatal, panic
  format: "text"       # text or json
  output: "stdout"     # stdout, stderr, or file path (e.g., "logs/app.log")
  reportCaller: false  # include caller information in logs