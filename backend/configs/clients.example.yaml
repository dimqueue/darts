clients:
  - serviceName: "word-service"
    protocol: "http"
    baseURL: "http://python-word-service:8000"
    timeout: 30
    retryCount: 3
    auth:
      type: "bearer"
      token: "your-auth-token-here"
    headers:
      Content-Type: "application/json"
      Accept: "application/json"

  - serviceName: "translation-service"
    protocol: "http"
    baseURL: "http://translation-service:8080"
    timeout: 60
    retryCount: 2
    auth:
      type: "apikey"
      apikey: "your-api-key-here"
      header: "X-API-Key"
    headers:
      Content-Type: "application/json"

  # Future gRPC example
